{% extends "base.html" %}
{% block title %}{{ software_name|lower }}{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">{% endblock %}
{% block body_class %}page-user{% endblock %}

{% block body %}
<main class="raw">
  <header class="raw__top">
    <span>{{ operator }}@{{ software_name|lower }}</span>
    <span id="status" data-state="offline">no link</span>
  </header>

  <form id="capture-form" novalidate>
    <div class="shot">
      <img id="preview" alt="" hidden>
      <div class="shot__empty" id="preview-empty">no photo</div>
    </div>
    <div class="keys">
      <label class="key" for="camera-input">take photo</label>
      <label class="key" for="library-input">choose</label>
    </div>
    <input class="visually-hidden" id="camera-input" type="file" accept="image/*" capture="environment">
    <input class="visually-hidden" id="library-input" type="file" accept="image/*">

    <label class="line"><span>first</span><input name="first" type="text" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <label class="line"><span>last</span><input name="last" type="text" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>

    <details class="more">
      <summary>+ details</summary>
      <label class="line"><span>dob</span><input name="dob" type="date"></label>
      <label class="line"><span>sex</span>
        <select name="sex"><option value="">rand</option>{% for value in sexes %}<option>{{ value }}</option>{% endfor %}</select>
      </label>
      <label class="line"><span>hgt</span><input name="height" type="text" maxlength="5" placeholder="5-10" autocomplete="off"></label>
      <label class="line"><span>eyes</span>
        <select name="eyes"><option value="">rand</option>{% for value in eyes %}<option>{{ value }}</option>{% endfor %}</select>
      </label>
      <label class="line"><span>hair</span>
        <select name="hair"><option value="">rand</option>{% for value in hair %}<option>{{ value }}</option>{% endfor %}</select>
      </label>
    </details>

    <button class="key key--send" id="send" type="submit">send</button>
    <p class="out" id="message" role="status" aria-live="polite"></p>
  </form>
</main>
{% endblock %}

{% block scripts %}<script src="{{ url_for('static', filename='js/user.js') }}"></script>{% endblock %}
